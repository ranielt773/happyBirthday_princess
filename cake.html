<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Cake 🎂</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(135deg,
                    #c4b5fd,
                    #e9d5ff,
                    #c084fc);

        }


        /* =========================
           HEART RAIN
        ========================= */

        .heart {

            position: fixed;

            top: -30px;

            color: #a78bfa;

            font-size: 20px;

            pointer-events: none;

            animation: fall linear forwards;

            z-index: 0;

        }


        @keyframes fall {

            0% {

                transform:
                    translateY(-30px) rotate(0deg);

                opacity: 0;

            }

            10% {
                opacity: 1;
            }

            100% {

                transform:
                    translateY(110vh) rotate(360deg);

                opacity: 0;

            }

        }


        /* =========================
           CAKE AREA
        ========================= */

        .cake-area {

            position: relative;

            width: 100%;

            max-width: 520px;

            height: 440px;

            margin: auto;

        }


        /* =========================
           CANDLE
        ========================= */

        .candle {

            position: absolute;

            left: 50%;

            top: 20px;

            transform: translateX(-50%);

            width: 28px;

            height: 100px;

            background:
                repeating-linear-gradient(45deg,
                    #c4b5fd 0px,
                    #c4b5fd 9px,
                    #f5f3ff 9px,
                    #f5f3ff 18px);

            border-radius: 7px;

            box-shadow:
                inset 0 0 0 2px rgba(255, 255, 255, 0.5);

            z-index: 10;

        }


        .wick {

            position: absolute;

            left: 50%;

            top: -12px;

            transform: translateX(-50%);

            width: 4px;

            height: 15px;

            background: #333;

            border-radius: 5px;

        }


        /* =========================
           FLAME
        ========================= */

        .flame {

            position: absolute;

            left: 50%;

            top: -62px;

            transform:
                translateX(-50%) rotate(45deg);

            width: 38px;

            height: 38px;

            background:
                linear-gradient(135deg,
                    #ffcf33,
                    #ff8c42);

            border-radius:
                50% 50% 50% 0;

            box-shadow:
                0 0 15px #ffb347,
                0 0 35px #ffd166,
                0 0 55px #ffb347;

            animation: flicker 0.18s infinite alternate;

            transition:
                0.7s ease;

            z-index: 20;

        }


        .flame::after {

            content: "";

            position: absolute;

            width: 17px;

            height: 17px;

            background: #fff4a3;

            border-radius:
                50% 50% 50% 0;

            left: 8px;

            top: 8px;

        }


        @keyframes flicker {

            from {

                transform:
                    translateX(-50%) rotate(43deg) scale(1);

            }

            to {

                transform:
                    translateX(-50%) rotate(47deg) scale(1.08);

            }

        }


        .flame.out {

            opacity: 0;

            transform:
                translateX(80px) translateY(-20px) rotate(80deg) scale(0.2);

        }


        /* =========================
           SMOKE
        ========================= */

        .smoke {

            position: absolute;

            left: 50%;

            top: -80px;

            transform: translateX(-50%);

            width: 12px;

            height: 12px;

            border-radius: 50%;

            background:
                rgba(120, 100, 150, 0.35);

            opacity: 0;

        }


        .smoke.show {

            animation:
                smokeRise 2s ease-out forwards;

        }


        @keyframes smokeRise {

            0% {

                opacity: 0;

                transform:
                    translateX(-50%) translateY(10px) scale(0.5);

            }

            25% {

                opacity: 0.7;

            }

            100% {

                opacity: 0;

                transform:
                    translateX(-50%) translateY(-80px) scale(4);

            }

        }


        /* =========================
           BOUQUET CAKE
        ========================= */

        .cake {

            position: absolute;

            bottom: 52px;

            left: 50%;

            transform: translateX(-50%);

            width: 350px;

            z-index: 3;

        }


        /* TOP */

        .cake-top {

            position: relative;

            width: 350px;

            height: 95px;

            background:
                linear-gradient(#fffdf9,
                    #f8eee8);

            border-radius:
                50% 50% 18px 18px;

            box-shadow:
                inset 0 -12px rgba(139, 92, 246, 0.08);

            z-index: 5;

        }


        /* VANILLA DRIP */

        .vanilla-drip {

            position: absolute;

            left: 0;

            top: 48px;

            width: 350px;

            height: 48px;

            background: #fffaf5;

            border-radius:
                0 0 25px 25px;

            z-index: 6;

        }


        .vanilla-drip::before {

            content: "";

            position: absolute;

            left: 20px;

            top: -15px;

            width: 55px;

            height: 35px;

            background: #fffaf5;

            border-radius: 50%;

            box-shadow:
                65px 5px 0 #fffaf5,
                130px -4px 0 #fffaf5,
                195px 5px 0 #fffaf5,
                260px -3px 0 #fffaf5;

        }


        /* UBE MIDDLE */

        .cake-middle {

            position: relative;

            width: 330px;

            height: 88px;

            margin: 0 auto;

            background:
                linear-gradient(#b99ae8,
                    #9871d1);

            border-radius:
                0 0 15px 15px;

            z-index: 3;

            overflow: hidden;

        }


        /* FROSTING LINES */

        .cake-middle::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                repeating-linear-gradient(90deg,
                    rgba(255, 255, 255, 0.16) 0px,
                    rgba(255, 255, 255, 0.16) 8px,
                    transparent 8px,
                    transparent 18px);

        }


        /* VANILLA LOWER LAYER */

        .cake-bottom {

            position: relative;

            width: 350px;

            height: 92px;

            background:
                linear-gradient(#fffaf5,
                    #f2e5dc);

            border-radius:
                0 0 22px 22px;

            z-index: 2;

            box-shadow:
                inset 0 -8px rgba(155, 111, 90, 0.08);

        }


        /* UBE STRIPE */

        .cake-bottom::after {

            content: "";

            position: absolute;

            left: 0;

            top: 20px;

            width: 100%;

            height: 28px;

            background:
                linear-gradient(#b99ae8,
                    #a17bd6);

            opacity: 0.9;

        }


        /* =========================
           BOUQUET FLOWERS
        ========================= */

        .flowers {

            position: absolute;

            left: 0;

            top: -45px;

            width: 350px;

            height: 115px;

            z-index: 12;

        }


        .flower {

            position: absolute;

            width: 58px;

            height: 58px;

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    #fff8ef 0 16%,
                    transparent 17%),
                radial-gradient(circle at 50% 10%,
                    #b99ae8 0 24%,
                    transparent 25%),
                radial-gradient(circle at 90% 40%,
                    #a984db 0 24%,
                    transparent 25%),
                radial-gradient(circle at 75% 90%,
                    #b99ae8 0 24%,
                    transparent 25%),
                radial-gradient(circle at 25% 90%,
                    #a984db 0 24%,
                    transparent 25%),
                radial-gradient(circle at 10% 40%,
                    #b99ae8 0 24%,
                    transparent 25%);

            filter:
                drop-shadow(0 3px 3px rgba(100, 60, 140, 0.15));

        }


        .flower.vanilla {

            background:
                radial-gradient(circle,
                    #e8b96b 0 12%,
                    transparent 13%),
                radial-gradient(circle at 50% 10%,
                    #fff8ed 0 25%,
                    transparent 26%),
                radial-gradient(circle at 90% 40%,
                    #fff3df 0 25%,
                    transparent 26%),
                radial-gradient(circle at 75% 90%,
                    #fff8ed 0 25%,
                    transparent 26%),
                radial-gradient(circle at 25% 90%,
                    #fff3df 0 25%,
                    transparent 26%),
                radial-gradient(circle at 10% 40%,
                    #fff8ed 0 25%,
                    transparent 26%);

        }


        .f1 {
            left: 8px;
            top: 35px;
        }

        .f2 {
            left: 65px;
            top: 5px;
            transform: scale(1.05);
        }

        .f3 {
            left: 125px;
            top: 28px;
            transform: scale(1.15);
        }

        .f4 {
            left: 190px;
            top: 4px;
            transform: scale(1.05);
        }

        .f5 {
            left: 250px;
            top: 32px;
        }


        /* SMALL FLOWERS */

        .small-flower {

            position: absolute;

            width: 20px;

            height: 20px;

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    #f4c96b 0 18%,
                    transparent 19%),
                radial-gradient(circle at 50% 0%,
                    #fff 0 35%,
                    transparent 36%),
                radial-gradient(circle at 100% 50%,
                    #fff 0 35%,
                    transparent 36%),
                radial-gradient(circle at 50% 100%,
                    #fff 0 35%,
                    transparent 36%),
                radial-gradient(circle at 0% 50%,
                    #fff 0 35%,
                    transparent 36%);

            z-index: 15;

        }


        .sf1 {
            left: 40px;
            top: 5px;
        }

        .sf2 {
            left: 105px;
            top: -8px;
        }

        .sf3 {
            left: 230px;
            top: -7px;
        }

        .sf4 {
            left: 285px;
            top: 5px;
        }


        /* =========================
           CAKE PLATE
        ========================= */

        .cake-plate {

            width: 410px;

            height: 28px;

            background:
                linear-gradient(white,
                    #f3e8ff);

            border-radius: 50%;

            position: absolute;

            bottom: 30px;

            left: 50%;

            transform: translateX(-50%);

            box-shadow:
                0 7px 18px rgba(0, 0, 0, 0.14);

            z-index: 1;

        }


        /* =========================
           WISH TEXT
        ========================= */

        #wishText {

            opacity: 1;

            animation:
                softPulse 2s infinite;

        }


        @keyframes softPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }

        }


        #afterWish {

            opacity: 0;

            transform: translateY(8px);

            transition:
                0.7s ease;

        }


        #afterWish.show {

            opacity: 1;

            transform: translateY(0);

        }


        /* =========================
           BUTTON
        ========================= */

        #blowButton {

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        #blowButton:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 8px 20px rgba(124, 58, 237, 0.25);

        }


        #blowButton:disabled {

            cursor: default;

            opacity: 0.8;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .cake {

                transform:
                    translateX(-50%) scale(0.78);

                transform-origin:
                    bottom center;

            }

            .cake-plate {

                transform:
                    translateX(-50%) scale(0.78);

            }

            .cake-area {

                height: 390px;

            }

        }
    </style>

</head>


<body>

    <div id="heartRain"></div>


    <main class="
            relative
            z-10
            min-h-screen
            flex
            items-center
            justify-center
            px-4
        ">

        <div class="
                bg-white/80
                backdrop-blur-md
                rounded-3xl
                shadow-2xl
                p-6
                md:p-10
                w-full
                max-w-xl
                text-center
            ">

            <h1 class="
                    text-3xl
                    md:text-4xl
                    font-bold
                    text-violet-500
                    mb-2
                ">
                A Birthday Cake For You 🎂
            </h1>


            <p class="
                    text-gray-500
                    mb-1
                ">
                Make a wish before you blow the candle 💗
            </p>


            <!-- CAKE -->

            <div class="cake-area">

                <!-- CANDLE -->

                <div class="candle">

                    <div class="wick"></div>

                    <div id="flame" class="flame"></div>

                    <div id="smoke" class="smoke"></div>

                </div>


                <!-- CAKE -->
                <!-- REAL BOUQUET CAKE -->

                <div class="cake-image-container">

                    <img src="cake.png" alt="Ube Vanilla Bouquet Cake" class="cake-image">

                </div>

            </div>


            <!-- MAKE A WISH FIRST -->

            <p id="wishText" class="
                    text-violet-500
                    font-bold
                    text-lg
                    mt-1
                    mb-4
                ">
                ✨ Make a wish... 💗
            </p>


            <!-- BLOW BUTTON -->

            <button id="blowButton" onclick="blowCandle()" class="
                    bg-violet-500
                    hover:bg-violet-600
                    text-white
                    font-bold
                    px-7
                    py-3
                    rounded-full
                    shadow-lg
                ">
                💨 Blow the Candle
            </button>


            <!-- AFTER BLOWING -->

            <div id="afterWish" class="mt-5">

                <p class="
                        text-violet-500
                        font-semibold
                        text-lg
                    ">
                    ✨ Wish made! 💗
                </p>

                <p class="
                        text-gray-500
                        text-sm
                        mt-1
                    ">
                    I hope your wish comes true. 🌸
                </p>

            </div>


            <!-- BACK -->

            <a href="main.html" class="
                    inline-block
                    mt-6
                    text-sm
                    text-gray-500
                    hover:text-violet-500
                ">
                ← Back to surprises
            </a>

        </div>

    </main>


    <script>

        /* =========================
           HEART RAIN
        ========================= */

        const heartRain =
            document.getElementById("heartRain");


        function createHeart() {

            const heart =
                document.createElement("div");

            heart.className = "heart";

            heart.innerHTML =
                Math.random() > 0.5
                    ? "♥"
                    : "♡";


            heart.style.left =
                Math.random() * 100 + "vw";


            heart.style.fontSize =
                12 + Math.random() * 20 + "px";


            const duration =
                4 + Math.random() * 5;


            heart.style.animationDuration =
                duration + "s";


            heartRain.appendChild(heart);


            setTimeout(() => {

                heart.remove();

            }, duration * 1000);

        }


        setInterval(createHeart, 250);


        /* =========================
           BLOW CANDLE
        ========================= */

        function blowCandle() {

            const flame =
                document.getElementById("flame");

            const smoke =
                document.getElementById("smoke");

            const button =
                document.getElementById("blowButton");

            const afterWish =
                document.getElementById("afterWish");


            if (flame.classList.contains("out")) {
                return;
            }


            /* FLAME OUT */

            flame.classList.add("out");


            /* SMOKE */

            smoke.classList.add("show");


            /* BUTTON */

            button.disabled = true;

            button.innerHTML =
                "✨ Candle blown!";


            /* WISH MESSAGE */

            setTimeout(() => {

                afterWish.classList.add("show");

            }, 500);

        }

    </script>

</body>

</html>
